name: Upstream versions

# Weekly: opens (or updates) an issue when OpenSSL 3.5, PostgreSQL 18, MariaDB Connector/C 3.4,
# zstd or lz4 has a newer release than versions.json. Security releases ship within 7 days.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Compare with upstream
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          scripts/check-upstream.sh > report.txt
          echo "outdated=$?" >> "$GITHUB_OUTPUT"
          cat report.txt
      - name: Open or update the issue
        if: steps.check.outputs.outdated == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Newer upstream releases available"
          body="$(printf 'scripts/check-upstream.sh found:\n\n```\n%s\n```\n\nBump versions.json, rebuild, verify and release (scripts/release.sh). Security releases: within 7 days.' "$(cat report.txt)")"
          number="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')"
          if [ -n "$number" ]; then gh issue comment "$number" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
